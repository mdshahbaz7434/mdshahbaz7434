<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img" aria-label="Shehbaz Muneer  AI that turns into revenue, cost savings, and productivity">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#122033"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5C16C"/>
      <stop offset="50%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1100" height="320" rx="28" fill="url(#bg)"/>
  <circle cx="980" cy="-20" r="160" fill="#5EEAD4" opacity="0.08"/>
  <circle cx="80" cy="340" r="140" fill="#F5C16C" opacity="0.08"/>
  <text x="48" y="52" fill="#5EEAD4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="3">AI INDUSTRIALIZATION LEAD  ·  MLOPS  ·  FORWARD DEPLOYED</text>
  <text x="48" y="112" fill="#F8FAFC" font-family="ui-serif, Georgia, serif" font-size="48" font-weight="700">Shehbaz Muneer</text>
  <text x="48" y="152" fill="#CBD5E1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20">I turn production AI into revenue, cost-out, and hours back.</text>
  <rect x="48" y="176" width="220" height="3" rx="2" fill="url(#line)"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="48" y="206" width="240" height="86" rx="16" fill="#111827" stroke="#1F3347"/>
    <text x="68" y="246" fill="#F5C16C" font-size="28" font-weight="700">$2M+</text>
    <text x="68" y="272" fill="#94A3B8" font-size="13">fraud cost avoided / yr</text>

    <rect x="304" y="206" width="240" height="86" rx="16" fill="#111827" stroke="#1F3347"/>
    <text x="324" y="246" fill="#5EEAD4" font-size="28" font-weight="700">+20%</text>
    <text x="324" y="272" fill="#94A3B8" font-size="13">revenue lift from RAG</text>

    <rect x="560" y="206" width="240" height="86" rx="16" fill="#111827" stroke="#1F3347"/>
    <text x="580" y="246" fill="#93C5FD" font-size="28" font-weight="700">90%</text>
    <text x="580" y="272" fill="#94A3B8" font-size="13">ETL downtime removed</text>

    <rect x="816" y="206" width="236" height="86" rx="16" fill="#111827" stroke="#1F3347"/>
    <text x="836" y="246" fill="#F8FAFC" font-size="26" font-weight="700">wks ’ hrs</text>
    <text x="836" y="272" fill="#94A3B8" font-size="13">model time-to-production</text>
  </g>
</svg>
